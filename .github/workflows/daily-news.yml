name: Daily News Fetch

on:
  workflow_dispatch: # 手动触发（由 cron-job.org 定时调用）
    inputs:
      send_push:
        description: Trigger remote push after publishing changed data
        required: false
        default: true
        type: boolean
      force_push:
        description: Trigger remote push even when today's data is already published
        required: false
        default: false
        type: boolean

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Resolve publish date
        id: publish_date
        run: echo "as_of_date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check current daily snapshot
        id: snapshot
        env:
          AS_OF_DATE: ${{ steps.publish_date.outputs.as_of_date }}
        run: |
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const targetDate = process.env.AS_OF_DATE

          const readJSON = (path) => {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'))
            } catch {
              return null
            }
          }

          const currentData = readJSON('public/data.json')
          const history = readJSON('public/clock-history.json')
          const generatedDate = currentData?.generatedAt?.split('T')[0] ?? ''
          const historyDate = Array.isArray(history) ? history[0]?.date ?? '' : ''
          const published = generatedDate === targetDate && historyDate === targetDate

          console.log(`published=${published}`)
          EOF

      - name: Fetch and classify news
        id: fetch_news
        if: steps.snapshot.outputs.published != 'true'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.ALIYUN }}
        run: |
          node scripts/fetch-news.mjs
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('.tmp/news-fetch-report.json', 'utf8'))
          console.log(`classified_count=${report.classifiedCount || 0}`)
          console.log(`status=${report.status || 'unknown'}`)
          EOF

      - name: Recompute clock with news adjustment
        if: steps.snapshot.outputs.published != 'true' && steps.fetch_news.outputs.classified_count != '0'
        env:
          AS_OF_DATE: ${{ steps.publish_date.outputs.as_of_date }}
          DASHSCOPE_API_KEY: ${{ secrets.ALIYUN }}
        run: node scripts/compute-clock.mjs

      - name: Save daily history snapshot
        if: steps.snapshot.outputs.published != 'true' && steps.fetch_news.outputs.classified_count != '0'
        env:
          AS_OF_DATE: ${{ steps.publish_date.outputs.as_of_date }}
        run: node scripts/save-history.mjs

      - name: Detect dataset changes
        id: dataset
        run: |
          git add data/ public/data.json public/clock-history.json
          node <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const crypto = require('crypto')
          const data = JSON.parse(fs.readFileSync('public/data.json', 'utf8'))
          const newsIDs = Array.isArray(data.newsFeed) ? data.newsFeed.map((item) => item.id).sort().join(',') : ''
          const fingerprint = crypto.createHash('sha1').update(newsIDs || data.generatedAt || '').digest('hex').slice(0, 12)
          const count = data.newsFeed?.length || 0
          const signals = Array.isArray(data.newsFeed) ? data.newsFeed : []
          const leadSignal = signals
            .filter((item) => item && typeof item === 'object')
            .sort((a, b) => ((b.qualityScore || 0) + (b.impactScore || 0) * 8) - ((a.qualityScore || 0) + (a.impactScore || 0) * 8))[0] || null
          const body = count <= 1
            ? "Today's AI job signal is ready."
            : `${count} AI job signals are ready. See what changed today.`
          console.log(`dataset_id=${data.generatedAt}:${fingerprint}`)
          console.log(`generated_at=${data.generatedAt}`)
          console.log(`title=Daily Signals Ready`)
          console.log(`body=${body.replace(/\n/g, ' ').trim()}`)
          console.log(`signals_json=${JSON.stringify(signals).replace(/\n/g, ' ')}`)
          console.log(`lead_signal_json=${JSON.stringify(leadSignal).replace(/\n/g, ' ')}`)
          EOF
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.dataset.outputs.changed == 'true'
        env:
          AS_OF_DATE: ${{ steps.publish_date.outputs.as_of_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily news update $AS_OF_DATE"
          git push

      - name: Trigger daily push relay
        if: (steps.dataset.outputs.changed == 'true' || inputs.force_push) && inputs.send_push
        env:
          RELAY_BASE_URL: ${{ secrets.JOBS_PUSH_RELAY_URL }}
          RELAY_SHARED_SECRET: ${{ secrets.JOBS_PUSH_RELAY_SECRET }}
          DATASET_ID: ${{ steps.dataset.outputs.dataset_id }}
          GENERATED_AT: ${{ steps.dataset.outputs.generated_at }}
          PUSH_TITLE: ${{ steps.dataset.outputs.title }}
          PUSH_BODY: ${{ steps.dataset.outputs.body }}
          PUSH_SIGNALS_JSON: ${{ steps.dataset.outputs.signals_json }}
          PUSH_LEAD_SIGNAL_JSON: ${{ steps.dataset.outputs.lead_signal_json }}
        run: |
          for channel in daily important followed; do
            for environment in production sandbox; do
              echo "Triggering $channel push for $environment"
              payload="$(PUSH_CHANNEL="$channel" PUSH_ENVIRONMENT="$environment" node <<'EOF'
          const payload = {
            environment: process.env.PUSH_ENVIRONMENT,
            channel: process.env.PUSH_CHANNEL,
            datasetId: process.env.DATASET_ID,
            generatedAt: process.env.GENERATED_AT,
            title: process.env.PUSH_TITLE,
            body: process.env.PUSH_BODY,
            url: 'https://jobdoomsday.tech/',
            signals: JSON.parse(process.env.PUSH_SIGNALS_JSON || '[]'),
            leadSignal: JSON.parse(process.env.PUSH_LEAD_SIGNAL_JSON || 'null')
          }
          process.stdout.write(JSON.stringify(payload))
          EOF
              )"
              curl --fail --show-error --silent \
                -X POST "$RELAY_BASE_URL/api/push/daily-news" \
                -H "Authorization: Bearer $RELAY_SHARED_SECRET" \
                -H "Content-Type: application/json" \
                --data "$payload"
              echo
            done
          done
